name: v7 bulut alarmı
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: v7-alarm
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Önceki durumu yükle
        uses: actions/cache/restore@v4
        with:
          path: alarm/state
          key: v7-state-${{ github.run_id }}
          restore-keys: v7-state-
      - name: Sinyalleri hesapla ve gönder
        run: node alarm/run.mjs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      - name: Bulut verisini panoya yayınla
        run: |
          if [ -n "$(git status --porcelain veri)" ]; then
            git config user.name "v7-bulut"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add veri
            git commit -q -m "Bulut verisi güncellendi"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
      - name: Durumu kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alarm/state
          key: v7-state-${{ github.run_id }}
