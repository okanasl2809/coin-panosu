name: v7 bulut alarmı
# Sürekli mod: her çalışma ~5,5 saat açık kalır ve mum kapanışlarını ~20 sn içinde işler.
# Zamanlayıcı her 30 dk'da bir yeni çalışma ister; biri açıkken yenisi sırada bekler ve öncekisi bitince hemen başlar.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
concurrency:
  group: v7-alarm
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Önceki durumu yükle
        uses: actions/cache/restore@v4
        with:
          path: alarm/state
          key: v7-state-${{ github.run_id }}
          restore-keys: v7-state-
      - name: Sinyalleri ve balinaları izle
        run: node alarm/run.mjs --surekli
        env:
          SURE_DK: "330"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      - name: Durumu kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alarm/state
          key: v7-state-${{ github.run_id }}
